server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    sources:
      youtube: false

lavalink.plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - WEB
      - MWEB
      - WEBEMBEDDED
      - TV

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}""

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - TV
      - WEB
      - MWEB
      - WEBEMBEDDED
      - ANDROID_VR

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
