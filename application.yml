server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false

lavalink.plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - TV
      - WEB
      - MWEB
      - WEBEMBEDDED

    oauth:
      enabled: false

metrics:
  prometheus:
    enabled: false

sentry:

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
